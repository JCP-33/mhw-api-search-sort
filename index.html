<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Hunter: World Search and Sort</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/2e872fc204.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__logo--wrapper">
          <img src="assets/MHWorld-Logo.png" alt="" class="nav__logo--img" />
          <div class="nav__logo--title">MHW Search & Sort</div>
        </div>
        <div class="nav__links">
          <a href="#" class="nav__link">Home</a>
          <a href="#" class="nav__link">Search</a>
          <a href="#" class="nav__link">Contact</a>
        </div>
      </nav>
      <header>
        <div class="container">
          <div class="row">
            <div class="banner">
              <h1 class="banner__title">
                Monster Hunter: World Search and Sort
              </h1>
              <form class="banner__search">
                <input
                  type="text"
                  class="banner__search--input"
                  placeholder="Monster Name"
                />
                <!-- <button class="banner__search--button" type="submit">
                  Search
                </button> -->
              </form>
            </div>
          </div>
        </div>
      </header>
    </section>
    <main>
      <section id="monsters">
        <div class="container">
          <div class="row">
            <div class="filter__menu">
              <h2 class="filter__menu--title">Filter by:</h2>
              <select onchange="filterMonsters(event)" name="type" id="type">
                <option value="" selected disabled>Type</option>
                <option value="">Any</option>
                <option value="small">Small</option>
                <option value="large">Large</option>
              </select>
              <select
                onchange="filterMonsters(event)"
                name="species"
                id="species"
              >
                <option value="" selected disabled>Species</option>
                <option value="">Any</option>
                <option value="bird wyvern">Bird Wyverns</option>
                <option value="brute wyvern">Brute Wyverns</option>
                <option value="fanged wyvern">Fanged Wyverns</option>
                <option value="fish">Fishes</option>
                <option value="flying wyvern">Flying Wyverns</option>
                <option value="herbivore">Herbivores</option>
                <option value="neopteron">Neopterons</option>
                <option value="piscine wyvern">Piscine Wyverns</option>
                <option value="relict">Relicts</option>
                <option value="wingdrake">Wingdrakes</option>
                <option value="elder dragon">Elder Dragons</option>
              </select>
              <select
                onchange="filterMonsters(event)"
                name="element"
                id="element"
              >
                <option value="" selected disabled>Element</option>
                <option value="">Any</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="thunder">Thunder</option>
                <option value="ice">Ice</option>
                <option value="dragon">Dragon</option>
              </select>
              <select
                onchange="filterMonsters(event)"
                name="resistance"
                id="resistance"
              >
                <option value="" selected disabled>Resistance</option>
                <option value="">Any</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="thunder">Thunder</option>
                <option value="ice">Ice</option>
                <option value="dragon">Dragon</option>
              </select>
              <select
                onchange="filterMonsters(event)"
                name="weakness"
                id="weakness"
              >
                <option value="" selected disabled>Weakness</option>
                <option value="">Any</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="thunder">Thunder</option>
                <option value="ice">Ice</option>
                <option value="dragon">Dragon</option>
              </select>
            </div>
            <div class="monsters__loader--wrapper">

            </div>
            <div class="monster__list">
              
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <div class="row">
          <a href="#">
            <figure class="footer__logo">
              <img
                src="assets/MHWorld-Logo.png"
                class="footer__logo--img"
                alt=""
              />
            </figure>
          </a>
          <div class="footer__links">
            <a href="#" class="footer__link">Home</a>
            <a class="footer__link no-cursor">Search</a>
            <a class="footer__link no-cursor">Contact</a>
          </div>
          <div class="footer__copyright">Copyright &copy; Monster Hunter World: Search and Sort</div>
        </div>
      </div>
    </footer>
  </body>
</html>
